# /etc/nginx/sites-available/trippartner  →  ln -s to sites-enabled, then: sudo certbot --nginx -d trippartner.com -d www.trippartner.com
#   website (Next.js)            → 127.0.0.1:3000
#   /api and /admin (Express)    → 127.0.0.1:8080   (except the website's own /api/revalidate and /api/seo-pages)
upstream trippartner_web { server 127.0.0.1:3000; keepalive 16; }
upstream trippartner_api { server 127.0.0.1:8080; keepalive 16; }

server {
    listen 80;
    server_name trippartner.com;
    return 301 https://www.trippartner.com$request_uri;
}
server {
    listen 80;
    server_name www.trippartner.com;

    client_max_body_size 12m;          # payment-proof and ID uploads (max 3 MB per file)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API + staff dashboard
    location /api/  { proxy_pass http://trippartner_api; }
    location /admin { proxy_pass http://trippartner_api; }
    # …but these two belong to the website (cache refresh from the backend, page list for the SEO dashboard)
    location ~ ^/api/(revalidate|seo-pages)/?$ { proxy_pass http://trippartner_web; }

    # website build files (content-hashed: cache for a year)
    location /_next/static/ {
        proxy_pass http://trippartner_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    # images and videos
    location ~* ^/(img|video)/ {
        proxy_pass http://trippartner_web;
        expires 7d;
        add_header Cache-Control "public";
    }
    # pages, sitemap.xml, robots.txt
    location / { proxy_pass http://trippartner_web; }
}
